[package]
name = "phase18-harmonic-attention"
version = "0.1.0"
edition = "2024"
description = "Phase 18: Do harmonic attention heads improve over standard attention?"

[[bin]]
name = "train"
path = "src/train.rs"

[[bin]]
name = "analyze"
path = "src/analyze.rs"

[features]
cuda = ["candle-core/cuda", "candle-nn/cuda"]

[dependencies]
candle-core = "0.9"
candle-nn = "0.9"
rand = "0.9"
