[package]
name = "phase17-weight-analysis"
version = "0.1.0"
edition = "2024"
description = "Phase 17: Do harmonic embeddings create band-sparse weights?"

[[bin]]
name = "train"
path = "src/train.rs"

[[bin]]
name = "analyze"
path = "src/analyze.rs"

[features]
cuda = ["candle-core/cuda", "candle-nn/cuda"]

[dependencies]
candle-core = "0.9"
candle-nn = "0.9"
rand = "0.9"
