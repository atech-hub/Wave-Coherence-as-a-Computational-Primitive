[package]
name = "phase19b-harmonic-bias"
version = "0.1.0"
edition = "2024"
description = "Phase 19b: Does an additive harmonic bias improve or accelerate standard attention?"

[[bin]]
name = "train"
path = "src/train.rs"

[features]
cuda = ["candle-core/cuda", "candle-nn/cuda"]

[dependencies]
candle-core = "0.9"
candle-nn = "0.9"
rand = "0.9"
